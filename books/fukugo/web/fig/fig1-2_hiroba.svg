 style="font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:inherit">
<rect x="0" y="0" width="820" height="300" rx="5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-dasharray="7 5"/>
<rect x="270" y="100" width="280" height="110" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.4"/>
