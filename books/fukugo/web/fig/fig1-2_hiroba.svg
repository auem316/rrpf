<text x="680.0" y="153" font-size="17" font-weight="bold" text-anchor="middle">商業</text>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="410" y1="76" x2="410" y2="98" stroke="currentColor" stroke-width="2" marker-end="url(#a1)"/>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="222" y1="155" x2="268" y2="155" stroke="currentColor" stroke-width="2" marker-end="url(#a2)"/>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="598" y1="155" x2="552" y2="155" stroke="currentColor" stroke-width="2" marker-end="url(#a3)"/>
<text x="410" y="248" font-size="17" font-weight="bold" text-anchor="middle">入口は広場に向ける</text>
<rect x="20" y="228" width="150" height="56" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="1.4"/>
