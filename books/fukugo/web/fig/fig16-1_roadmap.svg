 style="font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:inherit">
<rect x="0" y="0" width="220" height="130" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="110.0" y="40" font-size="18" font-weight="bold" text-anchor="middle">フェーズ1</text>
<text x="110.0" y="76" font-size="18" font-weight="bold" text-anchor="middle">見える化</text>
<text x="110.0" y="110" font-size="16" text-anchor="middle">0〜1年目</text>
