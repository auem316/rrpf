<text x="560.0" y="176" font-size="17" font-weight="bold" text-anchor="middle">関門2</text>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="410.0" y1="200" x2="110.0" y2="200" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a1)"/>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="710.0" y1="200" x2="410.0" y2="200" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a2)"/>
<text x="410" y="232" font-size="17" text-anchor="middle">合意できなければ、前のフェーズに戻る</text>
<rect x="0" y="252" width="820" height="46" rx="5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="410" y="282" font-size="18" font-weight="bold" text-anchor="middle">戻るなら、早いほど安い</text>
