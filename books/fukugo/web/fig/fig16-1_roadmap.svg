<text x="710.0" y="76" font-size="18" font-weight="bold" text-anchor="middle">事業化と運営</text>
<text x="710.0" y="110" font-size="16" text-anchor="middle">3年目〜</text>
<line x1="260.0" y1="-4" x2="260.0" y2="150" stroke="currentColor" stroke-width="3" stroke-opacity="1.0"/>
