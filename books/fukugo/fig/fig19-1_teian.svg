<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 832 342" width="100%" role="img"
 aria-label="図19-1　通る提案の組み立て——計画のどこに乗り、何を出し、何を書くか"
 style="font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:inherit">
<rect x="0" y="0" width="250" height="44" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="125.0" y="29" font-size="19" font-weight="bold" text-anchor="middle">計画のどこに乗るか</text>
<rect x="0" y="50" width="250" height="70" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="125.0" y="92" font-size="17" text-anchor="middle">個別施設計画の施設と段</text>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="254" y1="85" x2="281" y2="85" stroke="currentColor" stroke-width="2" marker-end="url(#a1)"/>
<rect x="285" y="0" width="250" height="44" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="410.0" y="29" font-size="19" font-weight="bold" text-anchor="middle">何を出すか</text>
<rect x="285" y="50" width="250" height="70" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="410.0" y="92" font-size="17" text-anchor="middle">床・土地・運営</text>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="539" y1="85" x2="566" y2="85" stroke="currentColor" stroke-width="2" marker-end="url(#a2)"/>
<rect x="570" y="0" width="250" height="44" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="695.0" y="29" font-size="19" font-weight="bold" text-anchor="middle">何を書くか</text>
<rect x="570" y="50" width="250" height="70" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="695.0" y="92" font-size="17" text-anchor="middle">5つの項目</text>
<rect x="0" y="160" width="148" height="64" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="74.0" y="199" font-size="18" font-weight="bold" text-anchor="middle">課題</text>
<rect x="168" y="160" width="148" height="64" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="242.0" y="199" font-size="18" font-weight="bold" text-anchor="middle">財源</text>
<rect x="336" y="160" width="148" height="64" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="410.0" y="199" font-size="18" font-weight="bold" text-anchor="middle">他の例</text>
<rect x="504" y="160" width="148" height="64" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="578.0" y="199" font-size="18" font-weight="bold" text-anchor="middle">費用と年度</text>
<rect x="672" y="160" width="148" height="64" rx="5" fill="currentColor" fill-opacity="0.38" stroke="currentColor" stroke-width="2.2"/>
<text x="746.0" y="199" font-size="18" font-weight="bold" text-anchor="middle">出口</text>
<rect x="0" y="254" width="820" height="70" rx="5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="410" y="286" font-size="18" font-weight="bold" text-anchor="middle">担当者が、そのまま庁内の説明に使える理屈</text>
<text x="410" y="314" font-size="16" text-anchor="middle">1枚目に自社の紹介を書かない</text>
</svg>
