<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 832 392" width="100%" role="img"
 aria-label="図6-1　入口に商業、奥に文化——にぎやかさの順に並べる"
 style="font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:inherit">
<rect x="0" y="0" width="170" height="78" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="85" y="47" font-size="18" font-weight="bold" text-anchor="middle">奥・上の階</text>
<rect x="190" y="0" width="470" height="78" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="425" y="47" font-size="18" font-weight="bold" text-anchor="middle">閲覧席・学習席・郷土資料</text>
<rect x="0" y="92" width="170" height="78" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="85" y="139" font-size="18" font-weight="bold" text-anchor="middle">中ほど</text>
<rect x="190" y="92" width="470" height="78" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2"/>
<text x="425" y="139" font-size="18" font-weight="bold" text-anchor="middle">交流の場・工房・講座・子どもの本</text>
<rect x="0" y="184" width="170" height="78" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="85" y="231" font-size="18" font-weight="bold" text-anchor="middle">入口・1階</text>
<rect x="190" y="184" width="470" height="78" rx="5" fill="currentColor" fill-opacity="0.38" stroke="currentColor" stroke-width="2"/>
<text x="425" y="231" font-size="18" font-weight="bold" text-anchor="middle">カフェ・書店・新刊の棚・展示</text>
<text x="740" y="40" font-size="19" font-weight="bold" text-anchor="middle">静か</text>
<text x="740" y="248" font-size="19" font-weight="bold" text-anchor="middle">にぎやか</text>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="740" y1="225" x2="740" y2="64" stroke="currentColor" stroke-width="2.6" marker-end="url(#a1)"/>
<rect x="0" y="296" width="820" height="80" rx="5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="410" y="330" font-size="18" font-weight="bold" text-anchor="middle">通りから入った人が、ついでに奥へ進む</text>
<text x="410" y="360" font-size="16" text-anchor="middle">音と人の流れは、静かな場所に届きにくい</text>
</svg>
