<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 832 342" width="100%" role="img"
 aria-label="図14-1　四つの運営モデル——まとめる力と、行政が直接決められること"
 style="font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:inherit">
<rect x="0" y="0" width="190" height="90" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="95.0" y="52" font-size="17" font-weight="bold" text-anchor="middle">① 担当課別</text>
<rect x="210" y="0" width="190" height="90" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="305.0" y="52" font-size="17" font-weight="bold" text-anchor="middle">② 一体の指定管理</text>
<rect x="420" y="0" width="190" height="90" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="515.0" y="52" font-size="17" font-weight="bold" text-anchor="middle">③ 指定管理＋賃貸</text>
<rect x="630" y="0" width="190" height="90" rx="5" fill="currentColor" fill-opacity="0.38" stroke="currentColor" stroke-width="2.2"/>
<text x="725.0" y="52" font-size="17" font-weight="bold" text-anchor="middle">④ 民間が持つ</text>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="10" y1="130" x2="806" y2="130" stroke="currentColor" stroke-width="2.6" marker-end="url(#a1)"/>
<text x="410" y="166" font-size="17" font-weight="bold" text-anchor="middle">運営をまとめる力が強くなる</text>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="806" y1="200" x2="10" y2="200" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a2)"/>
<text x="410" y="236" font-size="17" text-anchor="middle">行政が直接決められることが多い</text>
<rect x="0" y="264" width="820" height="62" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="410" y="303" font-size="18" font-weight="bold" text-anchor="middle">どのモデルでも、館長役一人と包括管理を土台に</text>
</svg>
