<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 832 372" width="100%" role="img"
 aria-label="図9-1　Park-PFI のお金の流れ——収益施設の稼ぎを公園に戻す"
 style="font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:inherit">
<rect x="0" y="40" width="250" height="110" rx="5" fill="currentColor" fill-opacity="0.38" stroke="currentColor" stroke-width="2.2"/>
<text x="125" y="88" font-size="19" font-weight="bold" text-anchor="middle">収益施設</text>
<text x="125" y="120" font-size="16" text-anchor="middle">カフェ・レストラン</text>
<rect x="570" y="40" width="250" height="110" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="695" y="88" font-size="19" font-weight="bold" text-anchor="middle">公園の広場・園路</text>
<text x="695" y="120" font-size="16" text-anchor="middle">誰でも無料で使う</text>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="256" y1="80" x2="562" y2="80" stroke="currentColor" stroke-width="2.6" marker-end="url(#a1)"/>
<text x="410" y="66" font-size="17" font-weight="bold" text-anchor="middle">稼ぎの一部で整備・運営</text>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="562" y1="124" x2="256" y2="124" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a2)"/>
<text x="410" y="150" font-size="16" text-anchor="middle">人が来て、長くいる</text>
<rect x="150" y="196" width="520" height="76" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2"/>
<text x="410" y="228" font-size="17" font-weight="bold" text-anchor="middle">代わりに受ける特例</text>
<text x="410" y="258" font-size="16" text-anchor="middle">期間 最長20年／建物 12%まで</text>
<rect x="0" y="296" width="820" height="60" rx="5" fill="none" stroke="currentColor" stroke-width="2.2" stroke-dasharray="7 5"/>
<text x="410" y="334" font-size="18" font-weight="bold" text-anchor="middle">人が集まる場所でしか回りにくい</text>
</svg>
