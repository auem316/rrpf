<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 832 412" width="100%" role="img"
 aria-label="図2-2　4つの問いで類型を選ぶ"
 style="font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:inherit">
<rect x="250" y="0" width="320" height="56" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="410" y="35" font-size="18" font-weight="bold" text-anchor="middle">④ その場所で束ねる施設か</text>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="250" y1="28" x2="160" y2="28" stroke="currentColor" stroke-width="2" marker-end="url(#a1)"/>
<rect x="0" y="4" width="156" height="48" rx="5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-dasharray="7 5"/>
<text x="78" y="34" font-size="15" text-anchor="middle">残す・転じる・畳む</text>
<text x="205" y="20" font-size="15" text-anchor="middle">いいえ</text>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="410" y1="58" x2="410" y2="92" stroke="currentColor" stroke-width="2" marker-end="url(#a2)"/>
<text x="440" y="80" font-size="15" text-anchor="start">はい</text>
<rect x="180" y="96" width="460" height="84" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="410" y="130" font-size="17" text-anchor="middle">① 利用時間帯は補い合うか</text>
<text x="410" y="162" font-size="17" text-anchor="middle">② 利用者は重なるか</text>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="410" y1="182" x2="410" y2="214" stroke="currentColor" stroke-width="2" marker-end="url(#a3)"/>
<rect x="250" y="218" width="320" height="56" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="410" y="253" font-size="18" font-weight="bold" text-anchor="middle">③ 民間が稼げる立地か</text>
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="330" y1="276" x2="210" y2="320" stroke="currentColor" stroke-width="2" marker-end="url(#a4)"/>
<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="490" y1="276" x2="610" y2="320" stroke="currentColor" stroke-width="2" marker-end="url(#a5)"/>
<text x="250" y="300" font-size="15" text-anchor="end">いいえ</text>
<text x="570" y="300" font-size="15" text-anchor="start">はい</text>
<rect x="0" y="324" width="400" height="66" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="200" y="352" font-size="18" font-weight="bold" text-anchor="middle">A を軸にする</text>
<text x="200" y="378" font-size="16" text-anchor="middle">民間は小さな床で試す</text>
<rect x="420" y="324" width="400" height="66" rx="5" fill="none" stroke="currentColor" stroke-width="2.2"/>
<text x="620" y="352" font-size="18" font-weight="bold" text-anchor="middle">A を核に B・C・D を足す</text>
<text x="620" y="378" font-size="16" text-anchor="middle">テナントが決まった分だけ</text>
</svg>
