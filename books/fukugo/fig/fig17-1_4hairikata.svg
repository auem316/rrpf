<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 832 404" width="100%" role="img"
 aria-label="図17-1　4つの入り方と、お金・床の流れ"
 style="font-family:'Yu Gothic','Hiragino Kaku Gothic ProN','Noto Sans JP','Noto Sans CJK JP',sans-serif;color:inherit">
<rect x="150" y="0" width="80" height="44" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="190.0" y="29" font-size="19" font-weight="bold" text-anchor="middle">自治体</text>
<rect x="490" y="0" width="80" height="44" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="530.0" y="29" font-size="19" font-weight="bold" text-anchor="middle">民間</text>
<rect x="590" y="0" width="230" height="44" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="2.2"/>
<text x="705.0" y="29" font-size="19" font-weight="bold" text-anchor="middle">床・土地を持つのは</text>
<rect x="150" y="52" width="80" height="300" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="0"/>
<rect x="490" y="52" width="80" height="300" rx="5" fill="currentColor" fill-opacity="0.13" stroke="currentColor" stroke-width="0"/>
<rect x="0" y="60" width="140" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="70" y="98" font-size="17" font-weight="bold" text-anchor="middle">① 賃貸借</text>
<defs><marker id="a1" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="484" y1="82" x2="236" y2="82" stroke="currentColor" stroke-width="2" marker-end="url(#a1)"/>
<defs><marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="236" y1="112" x2="484" y2="112" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a2)"/>
<text x="360" y="75" font-size="15" font-weight="bold" text-anchor="middle">床を貸す</text>
<text x="360" y="105" font-size="15" text-anchor="middle">賃料を毎年払う</text>
<rect x="590" y="60" width="230" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="705" y="98" font-size="16" font-weight="bold" text-anchor="middle">民間</text>
<rect x="0" y="134" width="140" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="70" y="172" font-size="17" font-weight="bold" text-anchor="middle">② 今の床を買う</text>
<defs><marker id="a3" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="484" y1="156" x2="236" y2="156" stroke="currentColor" stroke-width="2" marker-end="url(#a3)"/>
<defs><marker id="a4" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="236" y1="186" x2="484" y2="186" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a4)"/>
<text x="360" y="149" font-size="15" font-weight="bold" text-anchor="middle">できている床を売る</text>
<text x="360" y="179" font-size="15" text-anchor="middle">代金を一度払う</text>
<rect x="590" y="134" width="230" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="705" y="172" font-size="16" font-weight="bold" text-anchor="middle">自治体（建物の一部）</text>
<rect x="0" y="208" width="140" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="70" y="246" font-size="17" font-weight="bold" text-anchor="middle">③ 新築で買う</text>
<defs><marker id="a5" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="484" y1="230" x2="236" y2="230" stroke="currentColor" stroke-width="2" marker-end="url(#a5)"/>
<defs><marker id="a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="236" y1="260" x2="484" y2="260" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a6)"/>
<text x="360" y="223" font-size="15" font-weight="bold" text-anchor="middle">注文どおり建てて渡す</text>
<text x="360" y="253" font-size="15" text-anchor="middle">完成時に代金を払う</text>
<rect x="590" y="208" width="230" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="705" y="246" font-size="16" font-weight="bold" text-anchor="middle">公共部分は自治体</text>
<rect x="0" y="282" width="140" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="2"/>
<text x="70" y="320" font-size="17" font-weight="bold" text-anchor="middle">④ 定期借地</text>
<defs><marker id="a7" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="236" y1="304" x2="484" y2="304" stroke="currentColor" stroke-width="2" marker-end="url(#a7)"/>
<defs><marker id="a8" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" fill="none" stroke="currentColor" stroke-width="2"/></marker></defs><line x1="484" y1="334" x2="236" y2="334" stroke="currentColor" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#a8)"/>
<text x="360" y="297" font-size="15" font-weight="bold" text-anchor="middle">土地を貸す</text>
<text x="360" y="327" font-size="15" text-anchor="middle">地代を払う</text>
<rect x="590" y="282" width="230" height="62" rx="5" fill="none" stroke="currentColor" stroke-width="1.6"/>
<text x="705" y="320" font-size="16" font-weight="bold" text-anchor="middle">土地は自治体、建物は民間</text>
<text x="410" y="384" font-size="15" text-anchor="middle">実線は床・土地の動き、点線はお金の動き</text>
</svg>
